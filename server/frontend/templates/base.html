<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/styles.css">
    <title>{% block title %}Cars Dealership{% endblock %}</title>
  </head>
  <body>
    <nav class="nav">
      <a href="/">Cars Dealership</a>
      <a href="/static/About.html">About Us</a>
      <a href="/static/Contact.html">Contact Us</a>
      <span class="spacer"></span>
      {% if request.user.is_authenticated %}
        <span>Logged in as {{ request.user.username }}</span>
        <a href="/logout/">Logout</a>
      {% else %}
        <a href="/login/?username=root">Login</a>
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
